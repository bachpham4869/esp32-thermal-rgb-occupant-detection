[env:esp32s3_cam]
platform = espressif32
board = esp32s3_cam
framework = arduino

board_build.partitions = esp32s3_cam_16MB.csv
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
upload_speed = 921600

lib_deps =

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1